[project]
name = "triagepilot"
version = "0.1.0"
description = "An L1 IT support triage agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.0.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.30.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
