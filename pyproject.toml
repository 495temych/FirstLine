[project]
name = "firstline"
version = "0.1.0"
description = "An L1 IT support triage agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.0.0",
    "langfuse>=5.0.4,<5.1",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.30.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "backend", "evals"]

[tool.poe.tasks]
format = "ruff format --check"
lint = "ruff check"
types = "pyright"
test = "pytest"
retrieval = "python -m evals --retrieval"
ts = "npm run check:ts"
e2e = "npm run e2e"
check = ["format", "lint", "types", "test", "retrieval", "ts", "e2e"]

[tool.ruff]
include = ["agent/**/*.py", "backend/**/*.py", "evals/**/*.py", "e2e/**/*.py", "conftest.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "PL", "S", "PT", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["agent", "backend", "evals"]
pythonpath = ["."]
addopts = "--import-mode=importlib --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["agent", "backend", "evals"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.pyright]
include = ["agent", "backend", "evals", "e2e", "conftest.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
